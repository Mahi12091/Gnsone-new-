name: GNSOne Market Ingestion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ingestion/**'
      - '.github/workflows/market-ingestion.yml'
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Yahoo ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_HISTORY_DAYS: '1825'
        run: node scripts/ingestion/yahoo-ingest.mjs

      - name: Run market structure ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingestion/market-structure-ingest.mjs
