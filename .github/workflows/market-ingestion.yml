name: GNSOne Market Ingestion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ingestion/**'
      - '.github/workflows/market-ingestion.yml'
  schedule:
    - cron: '30 13 * * 1-5'

permissions:
  contents: read

concurrency:
  group: gnsone-market-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Yahoo ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_HISTORY_DAYS: '1825'
        run: node scripts/ingestion/yahoo-ingest.mjs

      - name: Populate complete financial data layer
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_HISTORY_DAYS: '1825'
        run: node scripts/ingestion/complete-data-ingest.mjs

      - name: FMP secondary enrichment
        if: ${{ env.FMP_API_KEY != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingestion/fmp-ingest.mjs

      - name: Run market structure ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingestion/market-structure-ingest.mjs

      - name: Finalize canonical backend layers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingestion/finalize-backend.mjs

      # Completion-watch: keep the ingestion gate executable from main.
